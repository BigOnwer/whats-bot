[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "ca-certificates",
  "fontconfig",
  "glib",
  "libxcb",
  "libx11",
  "libxext",
  "libxrender",
  "libxrandr",
  "libxi",
  "libxdamage",
  "libxfixes",
  "libxcomposite",
  "libxcursor",
  "libxtst",
  "cups",
  "libdrm",
  "libgbm",
  "pango",
  "cairo",
  "gtk3",
  "atk",
  "at-spi2-atk",
  "at-spi2-core",
  "dbus",
  "expat",
  "libxshmfence",
  "alsa-lib",
  "mesa"
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"